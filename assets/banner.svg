<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tronex — Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0d1a"/>
      <stop offset="0.5" stop-color="#101427"/>
      <stop offset="1" stop-color="#0a0d1a"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 140) scale(520 300)">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 260) scale(560 320)">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 380) scale(700 220)">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="530" y1="0" x2="750" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="440" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9e9ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7dcff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glowViolet)"/>
  <rect width="1280" height="400" fill="url(#glowBlue)"/>
  <rect width="1280" height="400" fill="url(#glowTeal)"/>

  <!-- faint oversized code brackets drawn as paths -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 150 170 L 62 250 L 150 330"/>
    <path d="M 1122 170 L 1210 250 L 1122 330"/>
    <path d="M 1058 170 L 990 330"/>
  </g>

  <!-- corner decorations -->
  <g stroke="#a78bfa" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <path d="M 60 60 h 26 M 73 47 v 26"/>
    <path d="M 1194 340 h 26 M 1207 327 v 26"/>
  </g>
  <g fill="#2dd4bf" fill-opacity="0.7">
    <circle cx="150" cy="92" r="3"/>
    <circle cx="1120" cy="96" r="3"/>
    <circle cx="200" cy="330" r="2.4"/>
    <circle cx="1084" cy="322" r="2.4"/>
  </g>
  <g fill="#7c3aed" fill-opacity="0.6">
    <circle cx="96" cy="300" r="2.4"/>
    <circle cx="1186" cy="140" r="2.4"/>
  </g>

  <!-- thin frame -->
  <rect x="18" y="18" width="1244" height="364" rx="18" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- title -->
  <text x="640" y="196" text-anchor="middle" font-family="'Segoe UI','Inter',Arial,sans-serif" font-weight="800" font-size="104" letter-spacing="14" fill="url(#titleFill)" filter="url(#softGlow)">TRONEX</text>

  <!-- accent underline -->
  <rect x="530" y="228" width="220" height="5" rx="2.5" fill="url(#accent)"/>
  <circle cx="530" cy="230.5" r="4" fill="#7c3aed"/>
  <circle cx="750" cy="230.5" r="4" fill="#2dd4bf"/>

  <!-- subtitle -->
  <text x="640" y="286" text-anchor="middle" font-family="'Segoe UI','Inter',Arial,sans-serif" font-weight="500" font-size="27" letter-spacing="11" fill="#a5b4cf">FULL-STACK DEVELOPER</text>

  <!-- stack line -->
  <text x="640" y="334" text-anchor="middle" font-family="'Cascadia Code','Fira Code',Consolas,monospace" font-size="17" letter-spacing="2" fill="#64748b">Next.js &#183; NestJS &#183; Supabase &#183; React &#183; TypeScript</text>
</svg>
