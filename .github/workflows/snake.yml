name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (noir silver palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#e8e8e8&color_dots=#111111,#292929,#555555,#8a8a8a,#e8e8e8
            dist/github-contribution-grid-snake-dark.svg?color_snake=#e8e8e8&color_dots=#111111,#292929,#555555,#8a8a8a,#e8e8e8
            dist/github-contribution-grid-snake-light.svg?color_snake=#111111&color_dots=#ebedf0,#9e9e9e,#6b6b6b,#3d3d3d,#111111

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
